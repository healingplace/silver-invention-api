name: Build and Push API Image to ACR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'DocumentUploaderAPI/**'
      - '.github/workflows/acr-image-push.yml'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./DocumentUploaderAPI/DocumentUploaderAPI.csproj

      - name: Build
        run: dotnet build ./DocumentUploaderAPI/DocumentUploaderAPI.csproj --configuration Release --no-restore

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR login server
        id: acr
        run: |
          LOGIN_SERVER=$(az acr show --name "${{ vars.ACR_NAME }}" --query loginServer -o tsv)
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.acr.outputs.login_server }}/${{ vars.IMAGE_NAME }}:latest
            ${{ steps.acr.outputs.login_server }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image details
        run: |
          echo "Pushed images:"
          echo "${{ steps.acr.outputs.login_server }}/${{ vars.IMAGE_NAME }}:latest"
          echo "${{ steps.acr.outputs.login_server }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}"
